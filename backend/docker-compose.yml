services:
  swap-backend:
    build: .
    image: minotaur-swap-backend
    container_name: minotaur-swap-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://app.minotaursubnet.com}"
      VALIDATOR_API_URL: "${VALIDATOR_API_URL:-https://api.minotaursubnet.com}"
      ETH_RPC_URL: "${ETH_RPC_URL:-}"
      BASE_RPC_URL: "${BASE_RPC_URL:-}"
      BALANCES_FALLBACK_TO_VALIDATOR: "${BALANCES_FALLBACK_TO_VALIDATOR:-false}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
