[profile.default]
src = "contracts/src"
out = "out"
libs = ["lib"]
test = "contracts/test"
script = "contracts/script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true

# Platform contracts (AppIntentBase, EphemeralProxy, etc.) come from the
# minotaur_contracts repo as a submodule. App contracts inherit from them.
remappings = [
    "minotaur_contracts/=lib/minotaur_contracts/",
    "forge-std/=lib/minotaur_contracts/lib/forge-std/src/",
    "@openzeppelin/=lib/minotaur_contracts/lib/openzeppelin-contracts/",
    "openzeppelin-contracts/=lib/minotaur_contracts/lib/openzeppelin-contracts/contracts/",
]

[profile.default.fuzz]
runs = 256
